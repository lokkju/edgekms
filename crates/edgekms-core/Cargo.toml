[package]
name = "edgekms-core"
version = "0.1.0"
description = "edgekms key derivation, ciphertext format, auth and policy; no I/O"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.23.1"
hkdf = "0.13.0"
hmac = { version = "0.13", features = ["zeroize"] }
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", features = ["zeroize"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "ed25519", "p256"] }
thiserror = "2.0.21"
url = "2.5.8"
zeroize = "1.9.0"

[dev-dependencies]
pollster = "0.4"
ring = "0.17"
rand = "0.10.3"
ed25519-dalek = { version = "2.2.0", default-features = false }
