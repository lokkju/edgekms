[package]
name = "edgekms-worker"
version = "0.1.0"
description = "edgekms on Cloudflare Workers: Vault-compatible HTTP API over WebCrypto"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
edgekms-core = { path = "../edgekms-core" }
futures-util = { version = "0.3.34", default-features = false }
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Crypto", "SubtleCrypto", "CryptoKey", "HkdfParams", "AesGcmParams", "AesDerivedKeyParams", "HmacImportParams"] }
worker = { version = "0.8.7", features = ["d1"] }
zeroize = "1.9.0"

[dev-dependencies]
pollster = "0.4"
rand_core = "0.10.1"
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "ed25519", "p256"] }
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic"] }
ed25519-dalek = { version = "2.2.0", default-features = false }
sha2 = "0.11.0"
wasm-bindgen-test = "0.3.79"
