[package]
name = "edgekms-cli"
version = "0.3.0"
description = "edgekms command line: ssh, GitHub and OIDC login, offline break-glass decrypt and key export"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "edgekms_cli"

[[bin]]
name = "edgekms"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6", features = ["derive", "env"] }
edgekms-core = { path = "../edgekms-core" }
getrandom = "0.4"
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3"
thiserror = "2.0.21"
ureq = { version = "3", features = ["json"] }
url = "2"
zeroize = "1.9.0"

[dev-dependencies]
pollster = "0.4"
rand = "0.10.3"
tiny_http = "0.12"
